<style>
  .exam-bar { position: sticky; top: 64px; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: var(--cream); border: 1.5px solid var(--charcoal); border-radius: 14px; padding: 10px 16px; margin: 0 0 22px; box-shadow: var(--shadow-card); font-family: var(--font-ui); font-size: 14px; }
  .exam-bar .timer { font-family: var(--font-mono); font-size: 20px; color: var(--cocoa); min-width: 70px; }
  .exam-bar .timer.low { color: #dc2626; }
  .exam-bar .score { font-family: var(--font-display); font-size: 22px; font-weight: 600; }
  .set-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .set-tabs button { font-family: var(--font-ui); font-size: 14px; border: 1.5px solid var(--mist); background: var(--cream); border-radius: 20px; padding: 6px 16px; cursor: pointer; color: var(--charcoal); }
  .set-tabs button.on { border-color: var(--charcoal); background: #fff; box-shadow: var(--shadow-btn); }
  .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .sec-head .rule { font-family: var(--font-ui); font-size: 13px; color: var(--muted); }
  .q { border-top: 1px dashed rgba(23,23,23,.18); padding: 16px 0 6px; }
  .q:first-of-type { border-top: 0; }
  .q .qn { font-family: var(--font-ui); font-weight: 600; color: var(--sienna); margin-right: 6px; }
  .q .stem { margin: 0 0 10px; }
  .row-ox { display: flex; gap: 10px; }
  .row-ox button, .mc-opt { font: inherit; font-size: 16px; border: 1.5px solid var(--charcoal); background: #fff; border-radius: 10px; padding: 6px 18px; cursor: pointer; color: var(--cocoa); }
  .row-ox button { font-family: var(--font-display); font-size: 22px; padding: 4px 22px; }
  .row-ox button.sel, .mc-opt.sel { background: #fff0e6; border-color: var(--orange); box-shadow: inset 0 0 0 1px var(--orange); }
  .mc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mc-opt { text-align: left; display: flex; gap: 10px; align-items: baseline; }
  .mc-opt .k { font-family: var(--font-ui); font-weight: 600; color: var(--sienna); }
  .graded .row-ox button, .graded .mc-opt { cursor: default; }
  .row-ox button.right, .mc-opt.right { border-color: #15803d; background: #e8f7ee; box-shadow: inset 0 0 0 1px #15803d; }
  .row-ox button.wrong, .mc-opt.wrong { border-color: #dc2626; background: #fdecec; box-shadow: inset 0 0 0 1px #dc2626; }
  .mc-opt.missed { border-style: dashed; border-color: #15803d; }
  textarea.ans { width: 100%; min-height: 70px; font: inherit; font-size: 16px; border: 1.5px solid var(--charcoal); border-radius: 10px; padding: 8px 12px; background: #fff; color: var(--cocoa); resize: vertical; }
  textarea.ans.big { min-height: 120px; }
  .key { display: none; margin-top: 10px; background: #fff; border: 1.5px dashed var(--sienna); border-radius: 10px; padding: 10px 14px; font-size: 16px; }
  .graded .key { display: block; }
  .key .k-title { font-family: var(--font-hand); color: var(--sienna); font-size: 21px; }
  .self { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; font-family: var(--font-ui); font-size: 14px; }
  .self button { font-family: var(--font-ui); font-size: 13px; border: 1.5px solid var(--mist); background: var(--cream); border-radius: 16px; padding: 4px 12px; cursor: pointer; }
  .self button.on { border-color: var(--charcoal); background: #fff; box-shadow: var(--shadow-btn); }
  .self input { width: 64px; font: inherit; border: 1.5px solid var(--charcoal); border-radius: 8px; padding: 3px 8px; }
  .pts { font-family: var(--font-ui); font-size: 13px; color: var(--muted); margin-left: 6px; }
  .got { font-family: var(--font-ui); font-size: 13px; font-weight: 600; margin-left: 8px; }
  .got.p { color: #15803d; } .got.n { color: #dc2626; } .got.z { color: var(--muted); }
  .part { margin: 14px 0 0 0; padding-left: 14px; border-left: 3px solid #ffd2b8; }
  .part .pq { margin: 0 0 6px; }
  .result-card { text-align: center; }
  .result-card .big { font-family: var(--font-display); font-weight: 600; font-size: 72px; line-height: 1; color: var(--cocoa); }
  @media (max-width: 640px) { .mc-grid { grid-template-columns: 1fr; } .exam-bar { top: 56px; } }

<body data-ch="mock">

<div class="wrap">
  <div class="hero">
    <span class="kicker">중간고사 대비 · 75분 · 100점</span>
    <h1 class="display">mock<br>exam</h1>
    <p class="lede">교수님 기출 형식 그대로 — <span class="mk">진위형 20 · 선다형 20 · 단답식 30 · 서술형 30</span>. 1·2회는 기본, 3~5회는 심화(함정 진위형, 여러 단계 계산, 병목 이동·구간 소멸). 진위·선다는 자동 채점, 단답·서술은 모범답안을 보고 직접 채점해요. 오답은 −2점, 미기재는 0점.</p>
    <div class="set-tabs" id="setTabs"></div>
    <div data-sticker="star" data-rot="8" style="right:8%;top:80px;width:64px;height:64px"></div>
    <div data-sticker="factory" data-rot="-10" style="right:20%;top:200px;width:60px;height:60px"></div>
  </div>

  <div class="exam-bar" id="bar">
    <div><span class="timer" id="timer">75:00</span> <button class="pill small" type="button" id="timerBtn">시작</button></div>
    <div class="score" id="score">— / 100</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="pill small primary" type="button" id="gradeBtn">채점하기</button><button class="pill small" type="button" id="resetBtn">답안 지우기</button></div>
  </div>

  <main id="exam"></main>
</div>

<script>
(function () {
  const R = String.raw;
  const C = { ink: '#2b1a07', o: '#ff6f1e', s: '#ce500a', soft: '#fff0e6', mist: '#a8a29e' };
  const node = (x, y, id, t) => `<circle cx="${x}" cy="${y}" r="22" fill="#fff" stroke="${C.o}" stroke-width="1.8"/><text x="${x}" y="${y - 1}" text-anchor="middle" font-weight="600" fill="${C.s}">${id}</text><text x="${x}" y="${y + 13}" text-anchor="middle" font-size="10.5" fill="#6b5d4f">${t}</text>`;
  /* 선행관계 그림: N = { 작업: [x, y, 시간] }, E = [[선행, 후행], ...] */
  let figId = 0;
  const prec = (N, E, w = 540, h = 180) => {
    const id = 'mk' + (++figId);
    let s = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;height:auto" font-family="Geist, Gowun Dodum, sans-serif" font-size="13"><defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="${C.ink}"/></marker></defs>`;
    for (const [f, t] of E) { const [x1, y1] = N[f], [x2, y2] = N[t], L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L; s += `<line x1="${x1 + ux * 22}" y1="${y1 + uy * 22}" x2="${x2 - ux * 25}" y2="${y2 - uy * 25}" stroke="${C.ink}" marker-end="url(#${id})"/>`; }
    for (const k in N) s += node(N[k][0], N[k][1], k, N[k][2]);
    return s + '</svg>';
  };
  const precFig = prec({ A: [40, 90, 50], B: [150, 40, 40], C: [150, 140, 30], D: [270, 40, 60], E: [270, 140, 20], F: [390, 90, 40], G: [500, 90, 30] },
    [['A', 'B'], ['A', 'C'], ['B', 'D'], ['C', 'E'], ['D', 'F'], ['E', 'F'], ['F', 'G']]);
  const precFig4 = prec({ A: [40, 110, 30], B: [150, 40, 45], C: [150, 180, 20], D: [270, 40, 25], E: [270, 140, 35], F: [270, 210, 15], G: [390, 110, 40], H: [500, 110, 20] },
    [['A', 'B'], ['A', 'C'], ['B', 'D'], ['C', 'E'], ['C', 'F'], ['D', 'G'], ['E', 'G'], ['F', 'G'], ['G', 'H']], 540, 240);
  const tbl = (head, rows) => `<div class="tbl-wrap"><table class="t" style="font-size:15px"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  /* ================= 문제 ================= */
  const SETS = [
  { id: 1, name: '모의고사 1회', sections: [
    { title: '1. 진위형', rule: '20점, 각 4점, 오답 시 −2점', type: 'ox', pts: 4, items: [
      { q: '미션은 단기간에 바뀌지 않는 기업 고유의 사명으로, 기업 존재의 이유를 의미한다.', a: true, ex: '미션 = 기업 존재의 이유, 비전 = 미션 달성을 위해 바라는 미래상. (2장 p.3)' },
      { q: '제조고려설계(DFM)는 부품의 수를 늘려 각 부품의 기능을 단순화함으로써 제조를 쉽게 만드는 설계 방법이다.', a: false, ex: 'DFM 은 <b>부품의 수 감소</b>, 작업의 단순화, 표준화. (3장 p.9)' },
      { q: '공정도의 5가지 기호 중 작업 대상이 다음 작업을 기다리는 상황은 ‘저장(▽)’으로 표시한다.', a: false, ex: '다음 작업을 기다리는 상황 = <b>지체(D)</b>. 저장은 별도의 지시를 받기 전까지 현재 상태로 있는 상황. (4장 p.8)' },
      { q: '변동성 때문에 활용률이 100%가 되지 않더라도 대기행렬이 생길 수 있다.', a: true, ex: '충분한 공급 능력을 가지고 있음에도 변동성 때문에 대기행렬이 생기기도 함. (5장 p.2)' },
      { q: '피크용량은 잔업이나 임시직 등을 포함한 생산능력으로, 장기적으로 안정되게 유지할 수 있는 산출률이다.', a: false, ex: '피크용량은 단기적으로 가능한 최대 산출률이며 <b>장기적으로 유지할 수 없음</b>. 장기적으로 안정된 산출률은 안정용량. (7장 p.4)' }
    ] },
    { title: '2. 선다형', rule: '20점, 각 4점, 오답 시 −2점 (정답 모두 골라야 정답)', type: 'mc', pts: 4, items: [
      { q: '시스템 설계(전략적 의사 결정)에 해당하는 것을 모두 고르라.', c: ['설비 입지 선정', '생산 스케줄링', '공급 사슬 설계', '재고 관리'], a: [0, 2], ex: '시스템 설계 = 제품/서비스 설계, 프로세스 설계, 설비 입지 선정, 공급 사슬 설계. 스케줄링·재고 관리는 시스템 운영. (1장 p.9–10)' },
      { q: '카노 모델에서 “충족되면 만족이 크게 증가하지만, 충족되지 않아도 불만이 생기지 않는” 품질은?', c: ['당연적 품질', '일원적 품질', '매력적 품질', '무관심 품질'], a: [2], ex: '매력적 품질 (예: AI 실시간 통화 통역, 무료 룸 업그레이드). (3장 p.23–24)' },
      { q: '공정별 배치(process layout)에 대한 설명으로 옳은 것을 모두 고르라.', c: ['유사한 기계설비나 기능을 한 작업장이나 한 부서에 모아서 배치', '다품종 소량 생산에 적합', '각 작업장은 고도로 전문화된 하나의 작업만을 수행', '병원, 대학 등이 예'], a: [0, 1, 3], ex: '③ 은 제품별 배치의 특징. (4장 layout p.10–11)' },
      { q: '도착 간격이 지수분포를 따를 때의 특징으로 옳은 것을 모두 고르라.', c: ['표준 편차 값은 평균과 같다', '무기억성이다', '변동계수는 0 이다', '포아송 프로세스를 활용할 수 있다'], a: [0, 1, 3], ex: '평균 = 표준편차이므로 변동계수는 <b>1</b>. (5장 p.5)' },
      { q: '여러 자원으로 구성된 프로세스에서 최소 용량을 가진 자원을 (　　)이라고 한다.', c: ['여유용량', '병목', '흐름율', '가동률'], a: [1], ex: '병목(bottleneck) — 프로세스 전체의 용량은 병목 자원의 용량에 의해 결정. (7장 p.10)' }
    ] },
    { title: '3. 단답식', rule: '30점, 각 6점, 오답 시 −2점', type: 'sa', pts: 6, items: [
      { q: '프로세스 분석의 접근방법 6단계를 순서대로 나열하여라.', ans: '① 문제점과 개선 가능성의 인식 → ② 프로세스 분석 대상의 범위 설정 → ③ 프로세스 문서화 → ④ 프로세스 성과 평가 → ⑤ 프로세스 재설계 → ⑥ 재설계 프로세스의 적용 (4장 p.3)' },
      { q: '세 개의 독립적인 부품이 순차적인 배열로 구성된 제품이 있다. 부품의 신뢰성은 각각 0.95, 0.90, 0.98 이다. 전체 제품의 신뢰성은 얼마인가? 두 번째 부품이 고장 날 경우를 대비하여 같은 부품을 예비로 한 개 병렬 추가하면 전체 신뢰성은 얼마로 개선되는가?', ans: R`직렬: \(0.95 \times 0.90 \times 0.98 = 0.8379\)<br>예비 추가: 두 번째 부분 \(0.90 + (1-0.90)\times0.90 = 0.99\) → \(0.95 \times 0.99 \times 0.98 = 0.9217\) (약 0.084 개선)` },
      { q: '피자 가게에서 피자 한 판을 20,000 원에 판매한다. 한 판을 만드는 데 인건비 4,000 원, 재료비 8,000 원, 간접비 3,000 원이 든다. 이 피자 가게의 다요소 생산성을 계산하여라.', ans: R`\(\dfrac{20{,}000}{4{,}000 + 8{,}000 + 3{,}000} = \dfrac{20{,}000}{15{,}000} \approx 1.33\) (원/원)` },
      { q: 'DEF 병원에는 4인 병실 6개와 2인 병실 8개가 있다. 지난 4주간 병상에 머물다가 퇴원한 환자수는 각각 22명, 18명, 26명, 30명이다. DEF 병원의 주평균 병상 회전율은 얼마인가?', ans: R`병상 수 \(= 4\times6 + 2\times8 = 40\), 주평균 퇴원 \(= (22+18+26+30)/4 = 24\)명 → 병상회전율 \(= 24/40 = 0.6\) (회/주)` },
      { q: '은행 창구 직원 1명이 평균 5분 걸려 고객을 처리하고, 고객은 평균 6분마다 1명씩 도착한다. \\(CV_a = 1\\), \\(CV_p = 0.8\\) 일 때 활용률과 대기행렬의 평균 대기시간 \\(T_q\\) 를 구하여라.', ans: R`\(u = p/a = 5/6 \approx 83.3\%\)<br>\(T_q = 5 \times \dfrac{0.833}{1-0.833} \times \dfrac{1^2 + 0.8^2}{2} = 5 \times 5 \times 0.82 = 20.5\)분` }
    ] },
    { title: '4. 입지선택', rule: '15점 (부분점수 있음)', type: 'es', items: [
      { q: '한빛전자는 기존 시설의 용량이 부족하여 다른 곳에 신규공장을 건립하는 방안(대안 A)과 기존 시설을 확장하는 방안(대안 B), 그리고 외주 생산(대안 C)의 세 가지 대안을 고려하고 있다. 대안 A 는 고정비가 $300,000/년으로 높지만 단위당 변동비는 $40 으로 낮을 것으로 예상되며, 기존 시설을 확장하는 방안은 연간 고정비가 $100,000, 단위당 변동비가 $75 로 예상된다. 외주 생산은 개당 $100 의 구매비용이 발생한다.',
        parts: [
          { p: 4, q: '각 대안이 가장 유리한 생산량 구간을 구하여라.', ans: R`A: \(y = 300{,}000 + 40Q\), B: \(y = 100{,}000 + 75Q\), C: \(y = 100Q\)<br>C–B: \(100Q = 100{,}000 + 75Q \Rightarrow Q = 4{,}000\)<br>B–A: \(100{,}000 + 75Q = 300{,}000 + 40Q \Rightarrow Q \approx 5{,}714\)<br>(C–A: \(Q = 5{,}000\))<br>→ <b>Q &lt; 4,000: C</b> · <b>4,000 &lt; Q &lt; 5,714: B</b> · <b>Q &gt; 5,714: A</b>`, rubric: '식 세우기 1점, 손익분기점 2개 2점, 구간 결론 1점' },
          { p: 4, q: '연간 5,000 개를 생산할 때 어느 대안의 총비용이 가장 낮은가? 그리고 최소 총비용은?', ans: R`A: \(300{,}000 + 200{,}000 = 500{,}000\)<br>B: \(100{,}000 + 375{,}000 = 475{,}000\) <b>[가장 최소]</b><br>C: \(500{,}000\)`, rubric: '세 대안 총비용 3점, 결론 1점' },

    { title: '3. 단답식', rule: '30점, 각 6점, 오답 시 −2점', type: 'sa', pts: 6, items: [
      { q: '네 개의 독립적인 부품이 순차적인 배열로 구성된 제품이 있다. 부품의 신뢰성은 각각 0.98, 0.90, 0.95, 0.99 이다. 한 부품에만 같은 부품을 예비로 한 개 병렬 추가할 수 있다면 어느 부품에 추가해야 하며, 전체 신뢰성은 얼마에서 얼마로 개선되는가?', ans: R`현재: \(0.98\times0.90\times0.95\times0.99 \approx 0.8295\)<br>가장 신뢰성이 낮은 <b>0.90 부품</b>에 추가: \(0.90 + 0.10\times0.90 = 0.99\)<br>→ \(0.98\times0.99\times0.95\times0.99 \approx 0.9125\)` },
      { q: 'A 공장은 작업자 5명이 하루 8시간 일하여 200개를, B 공장은 작업자 4명이 하루 9시간 일하여 162개를 생산한다. 두 공장의 노동생산성을 구하고, 어느 공장이 몇 % 더 높은지 쓰라.', ans: R`A: \(200/(5\times8) = 5\) 개/(명·시간), B: \(162/(4\times9) = 4.5\) 개/(명·시간)<br>A 가 \((5-4.5)/4.5 \approx 11.1\%\) 더 높다` },
      { q: '작업시간의 합이 480초인 조립 라인에서 시간당 40개를 생산하려 한다. 작업장 주기시간, 이론적인 최소 작업장 수, 그 작업장 수로 운영할 때의 작업장 효율을 구하여라.', ans: R`주기시간 = 3600/40 = 90 초/개<br>최소 작업장 수 = \(\lceil 480/90 \rceil = \lceil 5.33 \rceil = 6\)개<br>효율 = \(480/(6\times90) \approx 88.9\%\)` },
      { q: '단일 창구에 평균 5분마다 고객이 도착하고(a = 5), 평균 서비스 시간은 4분이며, 관측된 평균 체류시간 T 는 12분이다. 평균 대기시간 \\(T_q\\), 대기 중인 평균 고객 수 \\(I_q\\), 서비스 받는 중인 고객 수 \\(I_p\\), 시스템 내 평균 고객 수 \\(I\\) 를 구하여라.', ans: R`\(T_q = T - p = 8\)분<br>\(I_q = T_q/a = 8/5 = 1.6\)명, \(I_p = u = 4/5 = 0.8\)명<br>\(I = T/a = 12/5 = 2.4\)명 \((= I_q + I_p)\)` },
      { q: '대안 X 는 연간 고정비 $500,000, 단위당 변동비 $30, 대안 Y 는 연간 고정비 $200,000, 단위당 변동비 $55 이다. 손익분기점을 구하고, 연간 수요가 15,000 일 때 유리한 대안과 두 대안의 총비용 차이를 쓰라.', ans: R`\(500{,}000 + 30Q = 200{,}000 + 55Q \Rightarrow Q = 12{,}000\)<br>Q = 15,000: X = 950,000, Y = 1,025,000 → <b>X</b>, 차이 $75,000` }
    ] },
    { title: '4. 입지선택', rule: '15점 (부분점수 있음)', type: 'es', items: [
      { q: '한 유통업체가 네 고객 위치에 납품할 물류센터 입지를 정하려 한다. 고객 위치와 주간 납품량(부하)은 다음과 같다. 거리는 직각거리를 사용한다.' + tbl(['고객', '(X, Y)', '부하'], [['A', '(1, 2)', '40'], ['B', '(4, 8)', '30'], ['C', '(7, 3)', '50'], ['D', '(9, 7)', '30']]),
        parts: [
          { p: 4, q: '무게중심점 \\((x^*, y^*)\\) 를 구하여라.', ans: R`\(\sum l = 150\)<br>\(x^* = \dfrac{40\cdot1 + 30\cdot4 + 50\cdot7 + 30\cdot9}{150} = \dfrac{780}{150} = 5.2\)<br>\(y^* = \dfrac{40\cdot2 + 30\cdot8 + 50\cdot3 + 30\cdot7}{150} = \dfrac{680}{150} \approx 4.53\)`, rubric: 'x* 2점, y* 2점' },
          { p: 4, q: '후보지 P(5, 5) 의 부하-거리 점수 ld 를 구하여라.', ans: 'A: (4+3)×40 = 280<br>B: (1+3)×30 = 120<br>C: (2+2)×50 = 200<br>D: (4+2)×30 = 180<br>ld = <b>780</b>', rubric: '거리 2점, 합계 2점' },
          { p: 7, q: '후보지 Q(7, 4) 의 ld 를 구하여 P 와 비교하고 어느 후보지를 선택할지 쓰라. 무게중심에 가까운 후보지가 항상 ld 가 최소가 되는지 설명하여라.', ans: 'Q: A (6+2)×40 = 320, B (3+4)×30 = 210, C (0+1)×50 = 50, D (2+3)×30 = 150 → ld = <b>730</b><br>730 &lt; 780 → <b>Q 선택</b><br>무게중심은 출발점일 뿐, 직각거리 ld 를 항상 최소로 만들지는 않는다 (무게중심에 더 가까운 P 가 오히려 ld 가 크다). 부하가 큰 C 에 가까운 Q 가 유리.', rubric: 'Q 의 ld 3점, 선택 2점, 설명 2점' }
        ] }
    ] },
    { title: '5. 용량계획', rule: '15점 (부분점수 있음)', type: 'es', items: [
      { q: 'E 세탁소의 업무는 접수 – 세탁 – 건조 – 다림질 – 포장 으로 구성된다. 지수가 접수(4분)와 포장(3분)을 모두 담당하고, 세탁은 세탁기 4 대(1 건당 30분), 건조는 건조기 4 대(1 건당 40분), 다림질은 직원 2 명(1 건당 12분)이 담당한다.',
        parts: [
          { p: 4, q: '공정별 용량을 시간 기준으로 계산하고 병목 공정을 쓰라.', ans: '접수 및 포장 (지수): 60/(4+3) ≈ 8.57 건/시간<br>세탁: 4×60/30 = 8 건/시간<br>건조: 4×60/40 = 6 건/시간<br>다림질: 2×60/12 = 10 건/시간<br>병목: <b>건조</b> (6 건/시간)', rubric: '용량 3점, 병목 1점' },
          { p: 4, q: '고객이 시간당 7 건 도착할 때 흐름율, 가동률, 여유용량, 세탁 공정의 가동률을 구하고 흐름 제약의 종류를 쓰라.', ans: '흐름율 = Min{7, 6} = 6 건/시간 → 공급량에 의한 흐름 제약<br>가동률 = 6/6 = 100%, 여유용량 = 0%<br>세탁 가동률 = 6/8 = 75%', rubric: '흐름율·제약 2점, 가동률·여유용량 1점, 세탁 가동률 1점' },
          { p: 7, q: '건조기를 2 대 추가 구입하였다. 새 병목 공정과 흐름율, 가동률, 여유용량을 구하여라. 이후 수요가 시간당 9 건으로 늘어나면 어느 자원을 먼저 늘려야 하며, 그 다음 병목은 어디인지 쓰라.', ans: '건조: 6×60/40 = 9 건/시간 → 새 병목: <b>세탁</b> (8 건/시간)<br>수요 7: 흐름율 = Min{7, 8} = 7 (수요량에 의한 흐름 제약), 가동률 = 7/8 = 87.5%, 여유용량 = 12.5%<br>수요 9: 흐름율 8 → 세탁기를 늘려야 함 (5 대 → 10 건/시간). 그 다음 병목은 <b>접수 및 포장 (지수, 8.57 건/시간)</b>', rubric: '새 병목 2점, 흐름율·가동률·여유용량 3점, 수요 9 분석 2점' }
        ] }
    ] }
  ] },

    { title: '3. 단답식', rule: '30점, 각 6점, 오답 시 −2점', type: 'sa', pts: 6, items: [
      { q: '용량의 4 가지 구분을 쓰고, 각각의 의미를 한 줄로 설명하여라.', ans: '설계용량: 이상적인 여건에서 이론적으로 산출할 수 있는 최대용량<br>기대용량: 현실적으로 최대로 기대되는 생산능력<br>피크용량: 잔업이나 임시직 등을 포함한 생산능력 (단기적 최대, 장기 유지 불가)<br>안정용량: 장기적으로 안정된 산출률 (7장 p.3–4)' },
      { q: '카노 설문에서 (1) 긍정 질문에 “당연하다”, 부정 질문에 “마음에 안 든다” 고 답한 경우와 (2) 긍정 질문에 “마음에 안 든다”, 부정 질문에 “마음에 든다” 고 답한 경우의 품질 요소를 각각 쓰라.', ans: '(1) 당연적 품질 (2) 역 품질 (3장 p.25 판정표)' },
      { q: '지난달 산출 1,200만원, 투입 노동 300만원 · 재료 400만원 · 에너지 100만원이었다. 이번 달은 산출 1,500만원, 노동 330만원 · 재료 520만원 · 에너지 150만원이다. 다요소 생산성의 변화율을 구하고, 산출이 늘었는데도 그런 결과가 나온 이유를 쓰라.', ans: R`지난달 \(1200/800 = 1.5\), 이번 달 \(1500/1000 = 1.5\) → 변화율 <b>0%</b><br>산출은 25% 늘었지만 투입도 25% 늘었기 때문 (생산성은 산출/투입의 상대적 지표)` },
      { q: '창구 3 개를 한 줄로 운영한다(풀링). 합친 줄의 평균 도착 간격은 4분, 평균 서비스 시간은 9분이며 \\(CV_a = CV_p = 1\\) 이다. 활용률과 평균 대기시간 \\(T_q\\) 를 구하여라.', ans: R`\(u = \dfrac{9}{4\times3} = 0.75\)<br>\(T_q \approx \dfrac{9}{3} \times \dfrac{0.75^{\sqrt{8}-1}}{1-0.75} \times 1 = 3 \times \dfrac{0.591}{0.25} \approx 7.09\)분` },
      { q: '주기시간이 45초인 조립 라인이 하루 8시간 가동된다. 하루 최대 생산량을 구하고, 작업시간의 합이 160초일 때 이론적인 최소 작업장 수를 쓰라.', ans: R`최대 생산량 = \(8\times3600/45 = 640\)개/일<br>최소 작업장 수 = \(\lceil 160/45 \rceil = \lceil 3.56 \rceil = 4\)개` }
    ] },
    { title: '4. 조립 라인의 작업장 재설계', rule: '15점 (부분점수 있음)', type: 'es', items: [
      { q: '제품 W 는 작업 A~H 를 모두 거쳐서 조립된다 (원 안의 숫자 = 작업소요시간, 초). 현재 작업장 배치는 [A] [B] [C, E] [D, F] [G] [H] 의 6 개 작업장이다.<div class="qfig" style="margin-top:10px">' + precFig4 + '</div>',
        parts: [
          { p: 4, q: '현재 배치의 주기시간, 최대 산출률, 제품 1 개당 유휴시간, 작업장 효율을 구하여라.', ans: '작업시간의 합 = 30+45+20+25+35+15+40+20 = 230 초<br>작업장 시간: 30 / 45 / 55 / 40 / 40 / 20 → 주기시간 = 55 초/개<br>최대 산출률 = 3600/55 ≈ 65.5 개/시간<br>유휴시간 = 6×55 − 230 = 100 초<br>효율 = 230/330 ≈ 69.7%', rubric: '각 1점' },
          { p: 4, q: '시간당 60 개를 생산하는 것으로 목표를 바꾼다. 목표 주기시간과 이론적인 최소 작업장 수를 구하고, 각 작업의 후행 작업수를 쓰라.', ans: '주기시간 = 3600/60 = 60 초/개<br>최소 작업장 수 = ⌈230/60⌉ = ⌈3.83⌉ = 4 개<br>후행 작업수: A 7, B 3, C 4, D 2, E 2, F 2, G 1, H 0', rubric: '주기·최소 작업장 2점, 후행 작업수 2점' },
          { p: 7, q: '[최대 후행 작업수 배정] 규칙(후행 작업수가 가장 많은 작업 우선, 같으면 작업시간이 큰 작업)으로 목표 주기시간 60 초에 맞춰 재배치하고, 효율을 구하여 현재 배치와 비교하여라.', ans: '작업장 1: A, C (50) — 남은 10초에 들어갈 작업 없음<br>작업장 2: B, F (60) — B(후행 3) 다음 남은 15초에 F(15)<br>작업장 3: E, D (60) — 후행 수 동률(2) → 시간이 큰 E 먼저<br>작업장 4: G, H (60)<br>→ 4 개 작업장, 주기시간 60 초, 산출률 60 개/시간, 유휴시간 10 초, 효율 230/240 ≈ <b>95.8%</b><br>비교: 산출률은 65.5 → 60 개/시간으로 약간 줄지만, 작업장 수 6 → 4 개, 효율 69.7% → 95.8% 로 크게 개선 (평가지표가 작업장 수·효율이면 새 배치가 우수)', rubric: '배정 4점, 효율 1점, 비교 2점' }
        ] }
    ] },
    { title: '5. 프로세스 변동성', rule: '15점 (부분점수 있음)', type: 'es', items: [
      { q: '콜센터에 평균 4분마다 1통의 전화가 오고(a = 4분, \\(CV_a = 1\\)), 상담 시간은 평균 6분이며 \\(CV_p = 1.5\\) 이다. 상담원은 한 줄(풀링)로 전화를 받는다. 고객 1명이 1분 기다릴 때마다 500원의 대기 비용이, 상담원 1명당 시간당 15,000원의 서비스 비용이 발생한다.',
        parts: [
          { p: 4, q: '상담원이 1 명이라면 어떻게 되는가? 대기행렬이 유지되려면 최소 몇 명이 필요한가?', ans: 'u = p/a = 6/4 = 150% ≥ 100% → 대기행렬이 계속 늘어남 (운영 불가)<br>u &lt; 1 이려면 6/(4m) &lt; 1 → <b>m ≥ 2</b>', rubric: '활용률 판단 2점, 최소 인원 2점' },
          { p: 5, q: '상담원이 2 명일 때와 3 명일 때의 활용률과 평균 대기시간 \\(T_q\\) 를 각각 구하여라.', ans: R`변동성 항 \(= (1 + 1.5^2)/2 = 1.625\)<br>m = 2: \(u = 6/8 = 0.75\), \(T_q = \dfrac{6}{2}\times\dfrac{0.75^{\sqrt6-1}}{0.25}\times1.625 \approx 3 \times 2.636 \times 1.625 \approx 12.85\)분<br>m = 3: \(u = 6/12 = 0.5\), \(T_q = \dfrac{6}{3}\times\dfrac{0.5^{\sqrt8-1}}{0.5}\times1.625 \approx 2 \times 0.563 \times 1.625 \approx 1.83\)분`, rubric: 'm=2 2점, m=3 2점, 변동성 항 1점' },
          { p: 6, q: '시간당 총비용(대기 비용 + 서비스 비용)을 비교하여 상담원 수를 결정하여라.', ans: '시간당 전화 = 60/4 = 15 통<br>m = 2: 대기 15×12.85×500 ≈ 96,375원 + 서비스 30,000원 ≈ <b>126,375원</b><br>m = 3: 대기 15×1.83×500 ≈ 13,725원 + 서비스 45,000원 ≈ <b>58,725원</b><br>→ <b>3 명</b>이 유리 (대기 비용과 서비스 비용의 균형, 5장 직원 수 계획)', rubric: '대기 비용 2점, 서비스 비용 2점, 결론 2점' }
        ] }
    ] }
  ] },

  { id: 5, name: '5회 (심화)', sections: [

      { q: '모듈화 설계는 제품의 종류와 규격을 표준에 따라 통일하여 제품의 다양성을 줄이는 방법이다.', a: false, ex: '설명은 <b>표준화</b>. 모듈화 설계는 표준화된 부품의 집합(모듈)으로 조립, 교환이 쉽도록 하여 다양한 제품을 생산. (3장 p.12, 14)' },
      { q: '프로젝트 프로세스는 고객화의 정도가 매우 높기 때문에 범용 설비를 이용한 자동화가 어렵고 숙련된 작업자가 요구된다.', a: true, ex: '(4장 p.12)' },
      { q: '다른 조건이 같을 때 활용률이 80% 에서 90% 로 높아지면 평균 대기시간은 12.5% 증가한다.', a: false, ex: R`\(\frac{u}{1-u}\): 4 → 9, 즉 <b>2.25배 (125% 증가)</b>. (5장 p.7)` },
      { q: '수요량에 의한 흐름 제약 상황에서는 병목 공정의 가동률도 100% 보다 작다.', a: true, ex: '흐름율 = 수요량 &lt; 병목 용량 이므로 병목도 쉬는 시간이 있다 (예제 2: 도우 75%). (7장 p.13, 28)' }

    { title: '2. 선다형', rule: '20점, 각 4점, 오답 시 −2점 (정답 모두 골라야 정답)', type: 'mc', pts: 4, items: [
      { q: '네 가지 경쟁우선순위 중 “시간기반 전략”에 해당하는 것을 모두 고르라.', c: ['제품 개발 속도 (Time to Market)', '신속한 납기', '정시 납기', '수량 유연성'], a: [0, 1, 2], ex: '수량 유연성은 유연성기반 전략. (2장 p.10–11)' },
      { q: '강건 설계와 다구찌 기법에 대한 설명으로 옳은 것을 모두 고르라.', c: ['외부 인자에 영향을 적게 받는 최적의 설계', '품질은 제품이 출하된 후 사회에 끼친 손실', '규격의 하한값과 상한값 사이에서는 손실이 0 이다', '품질을 손실의 개념으로 정량화 (품질손실함수)'], a: [0, 1, 3], ex: '③ 은 전통적 개념. 다구찌는 목표값에서 벗어나면 손실 발생. (3장 p.19–20)' },

      { q: '단일부품 복수시설 네트워크 최적화 모델에서 \\(\\sum_j x_{ij} \\le K_i y_i\\) 제약식이 의미하는 것은?', c: ['각 수요지의 수요량을 충족한다', '폐쇄된 공장(y = 0)은 수송할 수 없고, 가동 공장은 생산능력 이내로만 수송한다', '연간 고정비를 최소화한다', '수송량을 정수로 만든다'], a: [1], ex: '수요 충족은 \\(\\sum_i x_{ij} \\ge D_j\\). (6장 p.29)' },
      { q: '규모의 비경제가 발생하는 원인을 모두 고르라.', c: ['복잡성 (의사소통비용 증가)', '관리 초점의 상실', '비효율성 (조직의 관료화)', '고정비용의 분산'], a: [0, 1, 2], ex: '고정비용의 분산은 규모의 경제 요인. (7장 p.6–7)' }

    { title: '3. 단답식', rule: '30점, 각 6점, 오답 시 −2점', type: 'sa', pts: 6, items: [

      { q: '제조업의 주요 입지요인 4 가지를 쓰라.', ans: '① 수요자 및 시장의 근접성 ② 공급자 및 자원의 근접성 ③ 모기업 근접성 ④ 공공서비스, 세금, 부동산 비용 (6장 p.6)' },
      { q: '세 입지요인의 가중치가 각각 w, 0.3, 0.7 − w 이다. 후보 A 의 점수는 (90, 60, 70), 후보 B 의 점수는 (60, 80, 80) 이다. 가중치 w 가 얼마보다 클 때 A 를 선택하게 되는가?', ans: R`A: \(90w + 18 + 70(0.7 - w) = 67 + 20w\)<br>B: \(60w + 24 + 80(0.7 - w) = 80 - 20w\)<br>\(67 + 20w > 80 - 20w \Rightarrow w > 0.325\)` },
      { q: '세 공정이 직렬로 연결되어 있다: 공정 1 (6분, 1 명), 공정 2 (15분, 2 명), 공정 3 (9분, 1 명). 공정별 용량과 전체 용량을 구하고, 수요가 시간당 9 개일 때 흐름율과 가동률을 쓰라.', ans: R`공정 1: 10, 공정 2: \(2\times60/15 = 8\), 공정 3: \(60/9 \approx 6.67\) 개/시간 → 전체 용량 6.67 (병목 공정 3)<br>흐름율 = Min{9, 6.67} = 6.67 개/시간 (공급량에 의한 흐름 제약), 가동률 = 100%` },
      { q: '세 수요지 (0, 0) 부하 10, (10, 0) 부하 30, (4, 6) 부하 20 이 있다. 무게중심점을 구하고, 그 점을 반올림한 (6, 2) 에서의 부하-거리 점수 ld 를 구하여라.', ans: R`\(x^* = \dfrac{0 + 300 + 80}{60} \approx 6.33\), \(y^* = \dfrac{0 + 0 + 120}{60} = 2\)<br>ld(6, 2) = 10×(6+2) + 30×(4+2) + 20×(2+4) = 80 + 180 + 120 = <b>380</b>` }

    { title: '4. 입지선택', rule: '15점 (부분점수 있음)', type: 'es', items: [
      { q: '새 물류센터의 후보지 네 곳의 연간 고정비와 단위당 변동비는 다음과 같다.' + tbl(['후보지', '연간 고정비', '단위당 변동비'], [['P', '$150,000', '$18'], ['Q', '$90,000', '$30'], ['R', '$240,000', '$12'], ['S', '$200,000', '$20']]),
        parts: [
          { p: 5, q: '각 후보지가 가장 유리한 처리량 구간을 구하여라. 어느 구간에서도 유리하지 않은 후보지가 있다면 이유와 함께 쓰라.', ans: R`Q–P: \(90{,}000 + 30Q = 150{,}000 + 18Q \Rightarrow Q = 5{,}000\)<br>P–R: \(150{,}000 + 18Q = 240{,}000 + 12Q \Rightarrow Q = 15{,}000\)<br>→ <b>Q &lt; 5,000: Q</b> · <b>5,000 ~ 15,000: P</b> · <b>15,000 초과: R</b><br>S 는 P 보다 고정비와 변동비가 모두 커서 어떤 처리량에서도 최저 비용이 될 수 없다.`, rubric: '손익분기점 2점, 구간 2점, S 설명 1점' },
          { p: 4, q: '연간 처리량이 12,000 일 때 각 후보지의 총비용과 최적 후보지를 구하여라.', ans: 'P: 150,000 + 216,000 = <b>366,000</b> [가장 최소]<br>Q: 90,000 + 360,000 = 450,000<br>R: 240,000 + 144,000 = 384,000<br>S: 200,000 + 240,000 = 440,000', rubric: '총비용 3점, 결론 1점' },
          { p: 6, q: 'R 지역은 지방정부의 세제 혜택으로 연간 고정비가 $60,000 감소한다. 연간 12,000 일 때의 최적 후보지와 최소 총비용을 구하고, 유리한 구간이 어떻게 바뀌는지 설명하여라.', ans: R`R: \(180{,}000 + 12\times12{,}000 = 324{,}000\) → <b>R</b> 이 최적 (P 366,000)<br>새 손익분기점: P–R \(150{,}000 + 18Q = 180{,}000 + 12Q \Rightarrow Q = 5{,}000\), Q–R \(90{,}000 + 30Q = 180{,}000 + 12Q \Rightarrow Q = 5{,}000\)<br>→ 세 직선이 Q = 5,000 에서 만나므로 <b>Q &lt; 5,000: Q</b>, <b>Q &gt; 5,000: R</b> 이 되고 <b>P 가 유리한 구간은 사라진다</b>.`, rubric: '12,000 총비용 2점, 손익분기점 2점, 구간 변화 2점' }
        ] }
    ] },
    { title: '5. 용량계획', rule: '15점 (부분점수 있음)', type: 'es', items: [
      { q: 'F 빵집은 식빵을 판 단위로 생산한다. 반죽은 제빵사 2 명(1 판당 12분), 발효는 발효실 1 개(동시에 6 판, 60분), 굽기는 오븐 3 대(1 판당 25분), 포장은 직원 1 명(1 판당 4분)이 담당한다.',
        parts: [
          { p: 4, q: '공정별 용량을 시간 기준으로 계산하고, 병목 공정과 빵집 전체의 용량을 쓰라.', ans: '반죽: 2×60/12 = 10 판/시간<br>발효: 6×60/60 = 6 판/시간<br>굽기: 3×60/25 = 7.2 판/시간<br>포장: 60/4 = 15 판/시간<br>병목: <b>발효</b>, 전체 용량 6 판/시간', rubric: '용량 3점, 병목·전체 용량 1점' },
          { p: 5, q: '수요는 시간당 8 판이지만, 밀가루 공급 문제로 시간당 5 판 분량만 들어온다. 흐름율, 가동률, 여유용량, 굽기 공정의 가동률을 구하여라.', ans: '흐름율 = Min{가용 유입량 5, 수요량 8, 용량 6} = <b>5 판/시간</b><br>가동률 = 5/6 ≈ 83.3%, 여유용량 ≈ 16.7%<br>굽기 가동률 = 5/7.2 ≈ 69.4%', rubric: '흐름율 2점 (가용 유입량 고려), 가동률·여유용량 2점, 굽기 1점' },
          { p: 6, q: '밀가루 공급이 해결되었고 발효실을 1 개 추가하였다. 새 병목, 흐름율, 가동률을 구하라. 또 수요 8 판을 모두 충족하려면 오븐이 최소 몇 대 필요하며, 그때의 가동률은 얼마인가?', ans: '발효: 12×60/60 = 12 → 새 병목 <b>굽기 (7.2)</b><br>흐름율 = Min{8, 7.2} = 7.2 판/시간 (공급량에 의한 흐름 제약), 가동률 100%, 여유용량 0%<br>오븐 n 대: n×60/25 ≥ 8 → n ≥ 3.33 → <b>4 대</b> (9.6 판/시간)<br>이때 용량 = Min{10, 12, 9.6, 15} = 9.6, 흐름율 = 8 → 가동률 = 8/9.6 ≈ 83.3%', rubric: '새 병목·흐름율 2점, 오븐 대수 2점, 가동률 2점' }
        ] }
    ] }
  ] }
  ];

  /* ================= 화면 ================= */
  const S = { get: k => window.RL_STORE ? window.RL_STORE.get(k) : null, set: (k, v) => window.RL_STORE && window.RL_STORE.set(k, v) };
  const $ = id => document.getElementById(id);
  let cur = S.get('mock-set') || 1;
  let st = {};
  const key = () => 'mock-' + cur;
  const save = () => S.set(key(), st);
  const render = el => window.RL_RENDER_MATH && window.RL_RENDER_MATH(el);

  function drawTabs() {
    $('setTabs').innerHTML = SETS.map(s => `<button type="button" class="${s.id === cur ? 'on' : ''}" data-s="${s.id}">${s.name}</button>`).join('');
  }
  $('setTabs').onclick = e => { const b = e.target.closest('[data-s]'); if (!b) return; cur = +b.dataset.s; S.set('mock-set', cur); stopTimer(); load(); };

  function load() {
    st = S.get(key()) || { a: {}, self: {}, graded: false, left: 75 * 60 };
    drawTabs(); draw(); drawTimer();
  }

  function draw() {
    const set = SETS.find(s => s.id === cur);
    $('exam').innerHTML = set.sections.map((sec, si) => `<section class="card ${st.graded ? 'graded' : ''}" id="sec${si + 1}">
      <div class="sec-head"><h2>${sec.title}</h2><span class="rule">${sec.rule}</span></div>
      ${sec.items.map((it, qi) => qHtml(sec, si, it, qi)).join('')}
    </section>`).join('') + `<section class="card tint result-card" id="resCard" ${st.graded ? '' : 'hidden'}></section>`;
    $('exam').querySelectorAll('textarea.ans').forEach(t => t.oninput = () => { st.a[t.dataset.k] = t.value; save(); if (st.graded) score(); });
    render($('exam'));
    score();
  }

  function qHtml(sec, si, it, qi) {
    const k = `${si}-${qi}`, n = `${si + 1}-${qi + 1})`, ans = st.a[k];
    if (sec.type === 'ox') {
      const cls = v => { let c = ans === v ? 'sel' : ''; if (st.graded) { if (v === it.a) c += ans === v ? ' right' : ''; if (ans === v && v !== it.a) c += ' wrong'; } return c; };
      return `<div class="q"><p class="stem"><span class="qn">${n}</span>${it.q} ( )<span class="got" data-got="${k}"></span></p>
        <div class="row-ox">${[true, false].map(v => `<button type="button" class="${cls(v)}" data-k="${k}" data-v="${v}">${v ? 'O' : 'X'}</button>`).join('')}</div>
        <div class="key"><span class="k-title">정답 ${it.a ? 'O' : 'X'}</span> — ${it.ex}</div></div>`;
    }
    if (sec.type === 'mc') {
      const sel = new Set(ans || []);
      const cls = i => { let c = sel.has(i) ? 'sel' : ''; if (st.graded) { const ok = it.a.includes(i); if (ok && sel.has(i)) c += ' right'; else if (!ok && sel.has(i)) c += ' wrong'; else if (ok) c += ' missed'; } return c; };
      return `<div class="q"><p class="stem"><span class="qn">${n}</span>${it.q} ( )<span class="got" data-got="${k}"></span></p>
        <div class="mc-grid">${it.c.map((c, i) => `<button type="button" class="mc-opt ${cls(i)}" data-k="${k}" data-i="${i}"><span class="k">${'①②③④⑤'[i]}</span><span>${c}</span></button>`).join('')}</div>
        <div class="key"><span class="k-title">정답 ${it.a.map(i => '①②③④⑤'[i]).join(', ')}</span> — ${it.ex}</div></div>`;
    }
    if (sec.type === 'sa') {
      const sm = st.self[k];
      return `<div class="q"><p class="stem"><span class="qn">${n}</span>${it.q}<span class="pts">(${sec.pts}점)</span><span class="got" data-got="${k}"></span></p>
        <textarea class="ans" data-k="${k}" placeholder="답을 쓰세요" ${st.graded ? 'readonly' : ''}>${esc(ans || '')}</textarea>
        <div class="key"><span class="k-title">모범답안</span><div>${it.ans}</div>
          <div class="self">내 답은? ${['right', 'wrong'].map(v => `<button type="button" class="${sm === v ? 'on' : ''}" data-self="${k}" data-v="${v}">${v === 'right' ? '맞았어요 (+6)' : '틀렸어요 (−2)'}</button>`).join('')} <span style="color:var(--muted)">비워 두면 0점</span></div></div></div>`;
    }
    // 서술형
    return `<div class="q"><p class="stem">${it.q}</p>${it.parts.map((p, pi) => {
      const pk = `${k}-${pi}`, sv = st.self[pk];
      return `<div class="part"><p class="pq"><span class="qn">${si + 1}-${pi + 1})</span><span class="pts">(${p.p}점)</span> ${p.q}<span class="got" data-got="${pk}"></span></p>
        <textarea class="ans big" data-k="${pk}" placeholder="풀이와 답을 쓰세요" ${st.graded ? 'readonly' : ''}>${esc(st.a[pk] || '')}</textarea>
        <div class="key"><span class="k-title">모범답안</span><div>${p.ans}</div><div style="font-size:14px;color:var(--muted);margin-top:6px">채점 기준: ${p.rubric}</div>
          <div class="self">내 점수 <input type="number" min="0" max="${p.p}" step="1" value="${sv ?? ''}" data-score="${pk}" data-max="${p.p}"> / ${p.p}</div></div></div>`;
    }).join('')}</div>`;
  }
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

  $('exam').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.self) { st.self[b.dataset.self] = st.self[b.dataset.self] === b.dataset.v ? undefined : b.dataset.v; save(); draw(); return; }
    if (st.graded) return;
    const k = b.dataset.k; if (!k) return;
    if (b.dataset.v != null) { const v = b.dataset.v === 'true'; st.a[k] = st.a[k] === v ? undefined : v; }
    else if (b.dataset.i != null) { const s = new Set(st.a[k] || []), i = +b.dataset.i; s.has(i) ? s.delete(i) : s.add(i); st.a[k] = [...s].sort(); }
    save(); draw();
  });
  $('exam').addEventListener('input', e => {
    const t = e.target; if (!t.dataset.score) return;
    let v = t.value === '' ? undefined : Math.max(0, Math.min(+t.dataset.max, +t.value));
    st.self[t.dataset.score] = v; save(); score();
  });

  function score() {
    const set = SETS.find(s => s.id === cur);
    let total = 0, auto = 0, pending = 0;
    const mark = (k, v, txt) => { const el = document.querySelector(`[data-got="${k}"]`); if (!el) return; el.className = 'got ' + (v > 0 ? 'p' : v < 0 ? 'n' : 'z'); el.textContent = st.graded ? (txt ?? ((v > 0 ? '+' : '') + v + '점')) : ''; };
    set.sections.forEach((sec, si) => sec.items.forEach((it, qi) => {
      const k = `${si}-${qi}`, ans = st.a[k];
      if (sec.type === 'ox') { const v = ans == null ? 0 : ans === it.a ? sec.pts : -2; total += v; mark(k, v); }
      else if (sec.type === 'mc') { const a = ans || []; const v = !a.length ? 0 : (a.length === it.a.length && a.every(i => it.a.includes(i))) ? sec.pts : -2; total += v; mark(k, v); }
      else if (sec.type === 'sa') {
        const empty = !(ans || '').trim(), sm = st.self[k];
        const v = empty ? 0 : sm === 'right' ? sec.pts : sm === 'wrong' ? -2 : 0;
        if (!empty && !sm) pending++;
        total += v; mark(k, v, !empty && !sm ? '채점 대기' : undefined);
      } else it.parts.forEach((p, pi) => { const pk = `${k}-${pi}`, sv = st.self[pk]; if (sv == null) pending++; total += sv || 0; mark(pk, sv || 0, sv == null ? '채점 대기' : `${sv}/${p.p}점`); });
    }));
    $('score').textContent = st.graded ? `${total} / 100` : '— / 100';
    const rc = $('resCard');
    if (rc && st.graded) rc.innerHTML = `<span class="kicker">${set.name} 결과</span><div class="big">${total}<small style="font-size:24px;color:var(--muted)"> / 100</small></div>
      <p style="margin:10px 0 0">${pending ? `아직 직접 채점할 문항이 <b>${pending}개</b> 남았어요. 단답식은 “맞았어요/틀렸어요”, 서술형은 점수를 넣어 주세요.` : '채점 완료! 틀린 문제는 관련 장으로 돌아가 다시 보세요.'}</p>`;
  }

  $('gradeBtn').onclick = () => { st.graded = true; stopTimer(); save(); draw(); $('sec1').scrollIntoView({ behavior: 'smooth' }); };
  $('resetBtn').onclick = () => { if (!confirm('이 회차의 답안과 채점을 모두 지울까요?')) return; stopTimer(); st = { a: {}, self: {}, graded: false, left: 75 * 60 }; save(); draw(); drawTimer(); };

  /* 타이머 */
  let tick = null;
  function drawTimer() { const l = Math.max(0, st.left ?? 4500); $('timer').textContent = `${String(Math.floor(l / 60)).padStart(2, '0')}:${String(l % 60).padStart(2, '0')}`; $('timer').classList.toggle('low', l <= 600); $('timerBtn').textContent = tick ? '일시정지' : (l < 4500 ? '계속' : '시작'); }
  function stopTimer() { clearInterval(tick); tick = null; drawTimer(); }
  $('timerBtn').onclick = () => {
    if (tick) return stopTimer();
    if (st.graded) return;
    tick = setInterval(() => { st.left = (st.left ?? 4500) - 1; if (st.left % 10 === 0) save(); if (st.left <= 0) { stopTimer(); alert('시험 시간 종료! 채점하기를 눌러 보세요.'); } drawTimer(); }, 1000);
    drawTimer();
  };

  document.addEventListener('DOMContentLoaded', load);
})();
</script>
</body>
